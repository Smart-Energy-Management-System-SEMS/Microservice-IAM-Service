spring.application.name=iam-service
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.auto-create=${KAFKA_ENABLED:true}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:iam-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sems.*,java.util,java.lang
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.LinkedHashMap
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:true}

spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";}
spring.kafka.properties.ssl.truststore.type=${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
spring.kafka.properties.ssl.truststore.certificates=${KAFKA_SSL_CA_CERT:}

server.port=${SERVER_PORT:8080}

security.jwt.secret=${JWT_SECRET:replace_with_minimum_32_chars_secret_key_for_hs256}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
security.oauth2.google.scopes=${GOOGLE_SCOPES:openid,email,profile}
service.public-base-url=${IAM_DEPLOY_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

topics.iam-user-registered=iam.user.registered
topics.iam-user-logged-in=iam.user.logged-in
topics.iam-role-assigned=iam.role.assigned
topics.iam-role-assignment-requested=iam.role-assignment.requested
