spring.application.name=iam-service
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

server.port=${SERVER_PORT:8080}

security.jwt.secret=${JWT_SECRET:replace_with_minimum_32_chars_secret_key_for_hs256}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/iam/auth/google/callback}
security.oauth2.google.scopes=${GOOGLE_SCOPES:openid,email,profile}

topics.iam-user-registered=iam.user.registered
topics.iam-user-logged-in=iam.user.logged-in
topics.iam-role-assigned=iam.role.assigned
