spring.application.name=sems_iam

# Load local env file if present; production should use real environment variables
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:${DB_HOST:localhost}}:${SUPABASE_DB_PORT:${DB_PORT:5432}}/${SUPABASE_DB_NAME:${DB_NAME:postgres}}?sslmode=${SUPABASE_DB_SSLMODE:${DB_SSLMODE:require}}
spring.datasource.username=${SUPABASE_DB_USER:${DB_USER:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD:}}
